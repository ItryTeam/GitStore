<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"><meta name="robots" content="noindex,nofollow">
<title>Дашборд — GitStore</title><link rel="stylesheet" href="../assets/m3.css"></head><body>
<header class="bar"><a class="logo" href="../"><span class="ms">admin_panel_settings</span>Дашборд</a>
<nav><span class="muted" id="who"></span><button class="btn text" id="out" hidden>Выйти</button></nav></header>
<main class="wrap narrow">
<div class="card" id="login" hidden style="text-align:center;margin-top:48px"><span class="ms" style="font-size:48px;color:var(--p)">lock</span><h2 style="margin:8px 0">Вход для владельца</h2><p class="muted">Доступ только для аккаунта владельца магазина.</p><button class="btn lg" id="in"><span class="ms">login</span>Войти через Google</button></div>
<div class="card" id="denied" hidden style="text-align:center;margin-top:48px"><span class="ms" style="font-size:48px;color:var(--err)">block</span><h2 style="margin:8px 0">Нет доступа</h2><p class="muted">Этот аккаунт не является владельцем.</p></div>
<div id="panel" hidden>
 <div class="warn"><span class="ms">shield</span><div>Не запускайте чужие APK на основном телефоне. Проверьте SHA-256 в VirusTotal, а при сомнениях — откройте файл в эмуляторе.</div></div>
 <div class="chips" id="filters"><button class="chip on" data-s="new">Новые</button><button class="chip" data-s="approved">Одобрены</button><button class="chip" data-s="rejected">Отклонены</button><button class="chip" data-s="all">Все</button></div>
 <div id="list"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/config.js"></script><script src="../assets/util.js"></script>
<script>
const sb=supabase.createClient(GS.SUPABASE_URL,GS.SUPABASE_KEY), bucket=sb.storage.from('submissions');
let filter='new';
const show=id=>['login','denied','panel'].forEach(x=>$('#'+x).hidden=x!==id);
async function init(){
  if(!configured()){show('login');return snack('Заполните assets/config.js')}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');$('#out').hidden=true;$('#who').textContent='';return}
  $('#who').textContent=session.user.email; $('#out').hidden=false;
  if(session.user.email!==GS.OWNER_EMAIL){show('denied');return}
  show('panel'); load();
}
$('#in').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
$('#out').onclick=async()=>{await sb.auth.signOut();init()};
$('#filters').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.s;document.querySelectorAll('#filters .chip').forEach(c=>c.classList.toggle('on',c===b));load()};
const slug=s=>s.package_id.split('.').pop().toLowerCase();
function snippet(s){
  const sl=slug(s), base=`${GS.RAW_BASE}/apps/${sl}`;
  const json=JSON.stringify({id:s.package_id,name:s.app_name,icon:`${base}/icon.png`,description:s.description,category:s.category,type:s.type,version:s.version,
    ...(s.changelog?{changelog:s.changelog}:{}),apk:s.apk_url||`${GS.REPO_URL}/releases/download/${sl}-${s.version}/${sl}.apk`},null,2);
  return {json,line:`${base}/app.json`,sl};
}
async function card(s){
  const el=document.createElement('article'); el.className='sub-card';
  const {data:ic}=await bucket.createSignedUrl(s.icon_path,3600);
  const sn=snippet(s), src=safeUrl(s.source_url);
  el.innerHTML=`<img src="${esc(ic?.signedUrl||'')}" alt="">
  <div><h3>${esc(s.app_name)} <span class="status ${esc(s.status)}">${{new:'новая',approved:'одобрена',rejected:'отклонена'}[s.status]||esc(s.status)}</span></h3>
  <dl class="kv"><dt>Package</dt><dd class="mono">${esc(s.package_id)}</dd><dt>Версия</dt><dd>${esc(s.version)}</dd><dt>Тип</dt><dd>${esc(s.type)} · ${esc(s.category)}</dd>
  <dt>Автор</dt><dd>${esc(s.dev_name)} — ${esc(s.contact)}</dd><dt>Дата</dt><dd>${new Date(s.created_at).toLocaleString('ru')}</dd>
  ${src?`<dt>Исходники</dt><dd><a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(src)}</a></dd>`:''}${s.note?`<dt>Заметка</dt><dd>${esc(s.note)}</dd>`:''}</dl>
  <p>${esc(s.description)}</p>${s.changelog?`<p class="muted">Что нового: ${esc(s.changelog)}</p>`:''}
  <div class="sub-actions">
   <button class="btn tonal" data-a="dl"><span class="ms">download</span>Скачать APK</button>
   <button class="btn tonal" data-a="hash"><span class="ms">fingerprint</span>SHA-256 + VirusTotal</button>
   <button class="btn" data-a="approved"><span class="ms">check</span>Одобрить</button>
   <button class="btn out" data-a="rejected"><span class="ms">close</span>Отклонить</button>
   <button class="btn text" data-a="new">Вернуть в новые</button>
   <button class="btn err" data-a="del"><span class="ms">delete</span>Удалить</button></div>
  <div class="out-box" data-o></div>
  <details style="margin-top:12px"><summary>Как опубликовать</summary>
   <ol class="muted"><li>Скачай иконку, положи в <code>apps/${esc(sn.sl)}/icon.png</code></li><li>Создай релиз <code>${esc(sn.sl)}-${esc(s.version)}</code> с APK (если нет внешней ссылки)</li><li>Создай <code>apps/${esc(sn.sl)}/app.json</code>:</li></ol>
   <pre>${esc(sn.json)}</pre><div class="sub-actions"><button class="btn text" data-c="json">Копировать app.json</button></div>
   <p class="muted">4. Добавь строку в <code>apps.txt</code>:</p><pre>${esc(sn.line)}</pre><div class="sub-actions"><button class="btn text" data-c="line">Копировать строку</button><button class="btn text" data-a="icon">Скачать иконку</button></div></details></div>`;
  const out=$('[data-o]',el);
  async function fileUrl(download){ if(s.apk_path){const {data,error}=await bucket.createSignedUrl(s.apk_path,600,download?{download:`${slug(s)}-${s.version}.apk`}:undefined);if(error)throw error;return data.signedUrl} return s.apk_url }
  el.onclick=async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.c){await navigator.clipboard.writeText(b.dataset.c==='json'?sn.json:sn.line);return snack('Скопировано')}
    const a=b.dataset.a;
    try{
      if(a==='dl'){const u=safeUrl(await fileUrl(true));if(!u)throw new Error('нет ссылки');window.open(u,'_blank','noopener')}
      else if(a==='icon'){window.open(ic?.signedUrl,'_blank','noopener')}
      else if(a==='hash'){
        out.textContent='Скачиваю и считаю SHA-256…';
        const buf=await (await fetch(await fileUrl(false))).arrayBuffer();
        const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');
        out.innerHTML=`SHA-256: <code>${h}</code><br><a target="_blank" rel="noopener" href="https://www.virustotal.com/gui/file/${h}">Открыть в VirusTotal</a> · <a target="_blank" rel="noopener" href="https://www.virustotal.com/gui/home/upload">Загрузить файл вручную</a><br><span class="muted">Если VirusTotal не знает этот файл — загрузите его туда вручную.</span>`;
      }
      else if(a==='del'){
        if(!confirm('Удалить заявку и файлы?'))return;
        await bucket.remove([s.apk_path,s.icon_path].filter(Boolean));
        const {error}=await sb.from('submissions').delete().eq('id',s.id);if(error)throw error;load();
      }else{
        const note=a==='new'?null:prompt('Заметка (необязательно):','')||null;
        const {error}=await sb.from('submissions').update({status:a,note}).eq('id',s.id);if(error)throw error;load();
      }
    }catch(err){out.textContent='Ошибка: '+(err.message||err)}
  };
  return el;
}
async function load(){
  const list=$('#list'); list.innerHTML='<p class="muted">Загрузка…</p>';
  let q=sb.from('submissions').select('*').order('created_at',{ascending:false});
  if(filter!=='all') q=q.eq('status',filter);
  const {data,error}=await q;
  if(error){list.textContent='Ошибка: '+error.message;return}
  list.innerHTML=data.length?'':'<p class="muted">Заявок нет</p>';
  for(const s of data) list.append(await card(s));
}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')init()});
init();
</script></body></html>
