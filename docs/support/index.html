<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<title>Поддержка — GitStore</title><link rel="stylesheet" href="../assets/m3.css"></head><body>
<header class="bar"><a class="logo" href="../"><span class="ms">storefront</span>GitStore</a><nav><a class="btn text" href="../">Каталог</a><a class="btn tonal" href="../add/">Добавить</a></nav></header>
<main class="wrap narrow">
<section class="hero" style="padding-bottom:16px"><h1 style="font-size:40px">Поддержка</h1><p class="sub">Без регистрации и анкет: напишите, что случилось, и оставьте контакт — ответим там, где вам удобно.</p></section>
<div class="card" id="done" hidden style="text-align:center"><span class="ms" style="font-size:56px;color:var(--ok)">check_circle</span><h2 style="margin:8px 0">Сообщение отправлено</h2><p class="muted">Спасибо! Мы ответим на указанный контакт.</p><a class="btn tonal" href="">Написать ещё</a></div>
<form class="card" id="f" autocomplete="off">
 <input class="hp" name="website" tabindex="-1" autocomplete="off">
 <label class="field"><select name="topic"><option value="question">Вопрос</option><option value="bug">Ошибка в приложении или на сайте</option><option value="idea">Идея</option><option value="report">Жалоба на приложение в каталоге</option><option value="rights">Правообладатель: удалить приложение</option></select><span>Тема</span></label>
 <div class="row2">
  <label class="field"><input name="name" placeholder=" " required minlength="2" maxlength="60"><span>Как к вам обращаться</span></label>
  <label class="field"><input name="contact" placeholder=" " required minlength="3" maxlength="120"><span>Контакт (@telegram или e-mail)</span></label></div>
 <label class="field"><input name="package_id" placeholder=" " maxlength="120"><span>Приложение (package ID, если касается)</span></label>
 <label class="field"><textarea name="message" placeholder=" " required minlength="10" maxlength="2000" style="min-height:150px"></textarea><span>Сообщение</span></label>
 <div class="prog"><i></i></div>
 <button class="btn lg" id="send" type="submit"><span class="ms">send</span>Отправить</button>
</form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/config.js"></script><script src="../assets/util.js"></script>
<script>
const f=$('#f'),btn=$('#send'),prog=$('.prog'),sb=configured()?supabase.createClient(GS.SUPABASE_URL,GS.SUPABASE_KEY):null;
f.addEventListener('submit',async e=>{
  e.preventDefault(); if(f.website.value) return;
  if(!sb) return snack('Сайт ещё не настроен (assets/config.js)');
  const d=Object.fromEntries(new FormData(f)), t=k=>(d[k]||'').trim()||null;
  btn.disabled=true; prog.classList.add('on');
  try{
    const {error}=await sb.from('tickets').insert({topic:d.topic,name:t('name'),contact:t('contact'),package_id:t('package_id'),message:t('message')});
    if(error) throw error;
    f.hidden=true; $('#done').hidden=false; scrollTo({top:0,behavior:'smooth'});
  }catch(err){ console.error(err); snack('Не удалось отправить: '+(err.message||err)); }
  finally{ btn.disabled=false; prog.classList.remove('on'); }
});
</script></body></html>
